<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div><strong>Panel Administrador</strong></div>
        <nav>
            <a href="catalogo.html">Ver Catálogo</a>
            <a href="index.html" onclick="localStorage.removeItem('usuarioActual')">Salir</a>
        </nav>
    </header>
    <div class="container">
        <h2>Gestión de Usuarios</h2>
        <div id="lista-usuarios"></div>
        <h2 style="margin-top:20px;">Gestión de Productos y Stock</h2>
        <div id="lista-productos"></div>
    </div>
    <script src="app.js"></script>
    <script>
        if (!usuarioActual || usuarioActual.rol !== 'administrador') {
            alert('Acceso restringido');
            location.href = 'index.html';
        }

        function cargarAdmin() {
            const uDiv = document.getElementById('lista-usuarios');
            uDiv.innerHTML = '';
            usuarios.forEach((u, i) => {
                uDiv.innerHTML += `<p>${u.user} (${u.rol}) <button class="btn-danger" onclick="delUser(${i})" style="width:auto; display:inline;">Eliminar Cuenta</button></p>`;
            });

            const pDiv = document.getElementById('lista-productos');
            pDiv.innerHTML = '';
            productos.forEach(p => {
                pDiv.innerHTML += `<p>${p.nombre} - $${p.precio} | Stock: ${p.stock} (Vendedor: ${p.vendedor}) <button class="btn-danger" onclick="delProd(${p.id})" style="width:auto; display:inline;">Remover</button></p>`;
            });
        }
        cargarAdmin();

        function delUser(i) {
            usuarios.splice(i, 1);
            sincronizar();
            cargarAdmin();
        }

        function delProd(id) {
            productos = productos.filter(p => p.id !== id);
            sincronizar();
            cargarAdmin();
        }
    </script>
</body>
</html>
